name: Multi Stream Engine

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_extraction]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyTelegramBotAPI pycryptodome

      - name: Run Extraction Script
        env:
          FB_TOKEN: ${{ github.event.client_payload.fb_token }}
          PAGE_ID: ${{ github.event.client_payload.page_id }}
          SOURCE: ${{ github.event.client_payload.source }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          BOT_TOKEN: ${{ github.event.client_payload.bot_token }}
          COUNT: ${{ github.event.client_payload.count }}
        run: |
          python main.py  # تأكد أن اسم ملف البايثون في Repo هو main.py أو غيره حسب الاسم لديك
          
