name: Trigger Extraction

on:
  repository_dispatch:
    types: [trigger_extraction]

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Receive request
        env:
          SOURCE: ${{ github.event.client_payload.source }}
          COUNT: ${{ github.event.client_payload.count }}
        run: |
          echo "Request received"
          echo "Source: $SOURCE"
          echo "Requested count: $COUNT"

      - name: Send result to Telegram
        env:
          BOT_TOKEN: ${{ github.event.client_payload.bot_token }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode \
            "text=✅ تم استقبال الطلب ومعالجته بنجاح عبر GitHub Actions."
