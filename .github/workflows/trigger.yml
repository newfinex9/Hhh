name: Trigger Extraction

on:
  repository_dispatch:
    types:
      - trigger_extraction

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Install Python
        run: |
          python3 --version

      - name: Process M3U
        env:
          SOURCE: ${{ github.event.client_payload.source }}
          COUNT: ${{ github.event.client_payload.count }}
          BOT_TOKEN: ${{ github.event.client_payload.bot_token }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          cat > process.py <<'PY'
          import os
          import requests

          source = os.environ.get("SOURCE", "").strip()
          count = int(os.environ.get("COUNT", "1"))
          bot_token = os.environ.get("BOT_TOKEN")
          chat_id = os.environ.get("CHAT_ID")

          def telegram(text):
              requests.post(
                  f"https://api.telegram.org/bot{bot_token}/sendMessage",
                  data={
                      "chat_id": chat_id,
                      "text": text
                  },
                  timeout=30
              )

          try:
              if not source:
                  telegram("❌ لم يتم إرسال رابط المصدر.")
                  raise SystemExit(1)

              r = requests.get(
                  source,
                  timeout=30,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              r.raise_for_status()

              lines = r.text.splitlines()
              results = []

              current_name = None

              for line in lines:
                  line = line.strip()

                  if line.startswith("#EXTINF"):
                      if "," in line:
                          current_name = line.split(",", 1)[1].strip()
                      else:
                          current_name = "Unknown"

                  elif line and not line.startswith("#"):
                      results.append(
                          (current_name or "Unknown", line)
                      )
                      current_name = None

                  if len(results) >= count:
                      break

              if not results:
                  telegram("❌ لم يتم العثور على قنوات/روابط M3U صالحة.")
                  raise SystemExit(0)

              message = "✅ تم استخراج الروابط بنجاح\n\n"

              for i, (name, url) in enumerate(results, 1):
                  message += f"{i}. {name}\n{url}\n\n"

              # Telegram message limit
              if len(message) > 3900:
                  message = message[:3900] + "\n\n... تم اختصار النتيجة."

              telegram(message)

          except Exception as e:
              telegram(f"❌ حدث خطأ أثناء معالجة المصدر:\n{type(e).__name__}: {e}")
              raise
          PY

          python3 -m pip install requests
          python3 process.py
